name: Transphorm
description: 'Transphorm was a GaN (gallium nitride) power-semiconductor company based in
  Goleta, California, known for its GaN-on-Si cascode FET technology used in power supplies,
  fast chargers, motor drives, solar inverters, and EV charging. It was acquired by Renesas
  Electronics in June 2024, and transphormusa.com now redirects to the Renesas GaN
  power-discretes product line. Transphorm publishes no public web API surface.'
